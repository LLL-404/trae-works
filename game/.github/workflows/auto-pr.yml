name: Auto PR

on:
  push:
    branches-ignore:
      - main

jobs:
  create-pr:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Creating PR for branch: $BRANCH"
          if gh pr view --base main --head "$BRANCH" >/dev/null 2>&1; then
            echo "PR already exists, skipping creation."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Merge $BRANCH into main" \
              --body "Automatically created PR for branch $BRANCH."
          fi
